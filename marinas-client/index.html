    <script>
      // Set the theme before React loads so the page doesn't flash the wrong one.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("theme");
        } catch (e) {}
        if (theme !== "day" && theme !== "night") {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "night"
              : "day";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
      // Home only: start loading the hero portrait (the largest image on screen) before the app script runs
      if (location.pathname === "/") {
        var portrait = document.createElement("link");
        portrait.rel = "preload";
        portrait.as = "image";
        portrait.href = "/images/me/portrait.webp";
        portrait.setAttribute("fetchpriority", "high");
        document.head.appendChild(portrait);
      }
    </script>
