<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Logo mark (src/components/Logo.jsx) on a tile; colors are the Day / Night tokens (§B1.2) -->
  <style>
    .tile { fill: #F6F5F1; }
    .ring { stroke: #1B1E1A; }
    .dot { fill: #8E1B1F; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #151C19; }
      .ring { stroke: #DCE3DA; }
      .dot { fill: #E85458; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <g fill="none" stroke-linejoin="round" class="ring" transform="translate(1.6 1.6) scale(0.9)">
    <path stroke-width="2" d="M16 3.4c6 0 12.2 3.7 12.6 10.4.5 7-4.7 14.8-12.2 15C9.1 29 3.4 23.6 3.5 16.4 3.6 9.1 9.5 3.4 16 3.4Z" />
    <path stroke-width="1.8" d="M16.4 8.1c4.1 0 7.8 2.7 7.9 7.1.1 4.7-3.4 9.1-8.2 9.1-4.4 0-7.4-3.3-7.3-7.4.1-4.7 3.3-8.8 7.6-8.8Z" />
    <path stroke-width="1.6" d="M16.2 12.3c2.1 0 3.7 1.5 3.7 3.7 0 2.4-1.8 4.1-3.9 4.1-2 0-3.4-1.5-3.4-3.5 0-2.4 1.5-4.3 3.6-4.3Z" />
  </g>
  <circle class="dot" cx="16.09" cy="16.09" r="2.3" />
</svg>
